<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f3f8"><meta name="robots" content="noindex">
<title>Sign in | Safe Space Therapy</title>
<link rel="stylesheet" href="assets/site.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(115deg,#fff0f2 0%,#f1eafb 52%,#fff3e5 100%)}
.login-wrap{flex:1;display:grid;place-items:center;padding:36px 16px}
.login-card{width:min(100%,440px);background:#fff;border:1px solid #eee6f2;border-radius:24px;box-shadow:var(--shadow);padding:32px 28px}
.login-card h1{font-size:26px;letter-spacing:-.5px;margin:6px 0 4px;color:#41486a}
.login-card .sub{margin-bottom:18px}
.role-label{font-size:12px;font-weight:650;color:#7a7091;letter-spacing:.4px;margin-bottom:6px}
.segment{display:grid;grid-template-columns:1fr 1fr;background:var(--lav);border-radius:999px;padding:4px;margin-bottom:18px}
.segment button{border:0;background:transparent;border-radius:999px;padding:10px 8px;font-weight:650;color:#6b6283}
.segment button[aria-pressed="true"]{background:#fff;color:var(--purple-dark);box-shadow:0 2px 8px #57466d1c}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 0;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--purple-dark);border-color:var(--purple)}
label{font-size:13px;font-weight:600;color:#575c78}
.field{margin:6px 0 12px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;margin:2px 0 16px}
.check input{width:17px;height:17px;accent-color:var(--purple)}
.btn.block{width:100%}
.linkbtn{border:0;background:none;color:var(--purple-dark);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:13px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.status{min-height:22px}
.status.error{color:#a2435a}
.status.ok{color:#4e7a4c}
.back{display:inline-block;margin-top:16px;font-size:13px;color:var(--muted)}
.debug-box{display:grid;gap:6px;background:#fff7ec;border:1px dashed #e7c48f;border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:13px;color:#6d5532}
.debug-box code{font-size:13px;color:#35405f;background:#fff;border-radius:8px;padding:4px 8px;justify-self:start}
.debug-box .btn{justify-self:start}
</style>
<link rel="preload" href="assets/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
</head>
<body>
<div class="topbar"><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">♡ Safe Space Therapy</a></nav></div>

<main class="login-wrap">
  <section class="login-card" aria-labelledby="loginTitle">
    <div class="eyebrow">WELCOME</div>
    <h1 id="loginTitle">Sign in</h1>
    <p class="sub" id="loginSub">Your journal is saved to your account, on every device.</p>

    <div id="roleBlock">
      <div class="role-label" id="roleLabel">SIGN IN AS</div>
      <div class="segment" role="group" aria-labelledby="roleLabel">
        <button type="button" data-role="private" aria-pressed="true">Private</button>
        <button type="button" data-role="doctor" aria-pressed="false">Doctor</button>
      </div>
      <div class="tabs" role="tablist" id="privateTabs">
        <button type="button" role="tab" data-mode="signin" aria-selected="true">Sign in</button>
        <button type="button" role="tab" data-mode="signup" aria-selected="false">Create account</button>
      </div>
    </div>

    <form id="authForm" novalidate>
      <div id="nameRow" class="hidden">
        <label for="name">Name (optional)</label>
        <input class="field" id="name" autocomplete="name" placeholder="What should we call you?">
      </div>
      <div id="emailRow">
        <label for="email">Email</label>
        <input class="field" id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div id="passwordRow">
        <label for="password">Password</label>
        <input class="field" id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <label class="check" id="rememberRow"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
      <button class="btn block" type="submit" id="submitBtn">Sign in</button>
      <div class="row-between" id="helperRow">
        <button type="button" class="linkbtn" id="forgotBtn">Forgot password?</button>
        <span class="notice hidden" id="doctorNote">Doctor accounts are invite-only.</span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <a class="back" href="index.html" id="backLink">← Back to the website</a>
  </section>
</main>

<script src="assets/build/login.js" defer></script>
</body>
</html>
